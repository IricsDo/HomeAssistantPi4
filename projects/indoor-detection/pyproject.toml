[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistantpi4-indoor-detection"
version = "0.2.0"
description = "Unified indoor smoke, fire and person detection for Raspberry Pi 4"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy>=2.0,<3.0",
  "opencv-python>=4.10,<5.0",
  "Pillow>=11.0,<13.0",
  "psutil>=6.0,<8.0",
  "PyYAML>=6.0,<7.0",
  "ultralytics>=8.4,<9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
indoor-detect = "indoor_detection.cli:main"
indoor-train = "indoor_detection.train:main"
indoor-export = "indoor_detection.export:main"
indoor-benchmark = "indoor_detection.benchmark:main"
indoor-prepare-home-fire = "indoor_detection.dataset:prepare_main"
indoor-audit-dataset = "indoor_detection.dataset:audit_main"
indoor-evaluate = "indoor_detection.evaluate:main"
indoor-analyze-errors = "indoor_detection.error_analysis:main"
indoor-prepare-indoor-fs = "indoor_detection.indoor_fs_dataset:main"
indoor-compose-dataset = "indoor_detection.compose_dataset:main"
indoor-prepare-coco-person = "indoor_detection.coco_person_dataset:main"
indoor-prepare-joint = "indoor_detection.joint_dataset:main"
indoor-audit-person = "indoor_detection.person_audit:main"
indoor-review-person = "indoor_detection.person_review:main"
indoor-verify-person = "indoor_detection.person_consensus:main"
indoor-apply-person = "indoor_detection.person_enrichment:main"
indoor-audit-scoped = "indoor_detection.scoped_dataset_audit:main"
indoor-finalize-visual-gate = "indoor_detection.scoped_visual_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
