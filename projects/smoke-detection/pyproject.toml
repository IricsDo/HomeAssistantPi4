[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistantpi4-smoke-detection"
version = "0.1.0"
description = "Indoor smoke detection optimized for Raspberry Pi 4 deployment"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy>=2.0,<3.0",
  "opencv-python>=4.10,<5.0",
  "psutil>=6.0,<8.0",
  "PyYAML>=6.0,<7.0",
  "ultralytics>=8.4,<9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
smoke-detect = "smoke_detection.cli:main"
smoke-train = "smoke_detection.train:main"
smoke-export = "smoke_detection.export:main"
smoke-benchmark = "smoke_detection.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
